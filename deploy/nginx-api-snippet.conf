# Добавить ВНУТРЬ существующего server { ... } блока для myavto-agregator.ru
# (там же, где уже настроен SSL/certbot) — рядом с location / для статики.
#
# Проверить путь к конфигу на VPS: ls /etc/nginx/sites-enabled/
# После правки: sudo nginx -t && sudo systemctl reload nginx

location /api/ {
    proxy_pass http://127.0.0.1:5055/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
