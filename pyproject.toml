[tool.black]
# T-76 (24.08.2026): единый стиль форматирования на весь репозиторий вместо
# разнобоя (кавычки/длина строк отличались от скрипта к скрипту, см.
# TASKS.md). line-length=100 — длиннее дефолтных 88, чтобы меньше ломать
# существующие однострочные f-строки с русским текстом.
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Проверяем только неиспользуемые импорты/переменные (F401/F841) и
# переопределения (F811) — то, ради чего заводили ruff в T-76. Полный
# набор правил (стиль, сложность и т.д.) сознательно не включаем — это
# отдельная задача, не относится к "навести порядок с очевидным мусором".
select = ["F401", "F841", "F811"]
